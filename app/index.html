<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patron Reader</title>
  <meta name="theme-color" content="#E8EBE3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191D1B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Patron Reader">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar" id="bar">
    <a class="icon-btn" id="home" href="#/" aria-label="Feed" title="Feed" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h4.5v-5h2v5h4.5V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="bar-back" id="back" href="#/" hidden>‹ All</a>
    <div class="bar-text">
      <a class="bar-author" id="bar-author" href="#/" hidden></a>
      <h1 class="bar-title" id="bar-title">Patron Reader</h1>
    </div>
    <div class="bar-actions">
      <button class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="icon-btn" id="settings-link" href="#/settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </a>
      <a class="icon-btn" id="close" href="#/" aria-label="Close settings" title="Close" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </a>
    </div>
  </header>
  <div class="ptr" id="ptr" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="status" id="status" role="status" aria-live="polite" hidden></div>
  <main id="view"></main>

  <!-- Shown once listening has started in this chapter. -->
  <div class="audio" id="audio" role="group" aria-label="Listening" hidden>
    <button class="au-btn" id="au-prev" aria-label="Previous paragraph">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="au-btn au-main" id="au-toggle" aria-label="Pause"></button>
    <button class="au-btn" id="au-next" aria-label="Next paragraph">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Slides up when you tap a chapter. -->
  <div class="controls" id="controls" role="toolbar" aria-label="Reading controls" aria-hidden="true">
    <button class="ct-play" id="ct-play" type="button"></button>
    <div class="ct-group" role="group" aria-label="Speed">
      <button class="ct-btn" id="ct-slower" type="button" aria-label="Slower">−</button>
      <span class="ct-value" id="ct-rate"></span>
      <button class="ct-btn" id="ct-faster" type="button" aria-label="Faster">+</button>
    </div>
    <div class="ct-group" role="group" aria-label="Text size">
      <button class="ct-btn ct-a" id="ct-smaller" type="button" aria-label="Smaller text">A−</button>
      <button class="ct-btn ct-a" id="ct-larger" type="button" aria-label="Larger text">A+</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js" type="module"></script>
</body>
</html>
